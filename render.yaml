services:
  - type: web
    name: ai-trade-assist-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ACTIVE_BROKER
        value: REAL_NSE_PUBLIC
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
